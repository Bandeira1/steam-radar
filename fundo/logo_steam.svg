<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280">
  <!-- Logo da Steam redesenhado a partir da imagem de referência -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="1270">
      <stop offset="0" stop-color="#111d2e"/>
      <stop offset="0.21" stop-color="#051839"/>
      <stop offset="0.41" stop-color="#0a1b48"/>
      <stop offset="0.58" stop-color="#132e62"/>
      <stop offset="0.74" stop-color="#144b7e"/>
      <stop offset="0.87" stop-color="#136497"/>
      <stop offset="1" stop-color="#1387b8"/>
    </linearGradient>
    <clipPath id="c"><circle cx="640" cy="640" r="630"/></clipPath>
  </defs>
  <circle cx="640" cy="640" r="630" fill="url(#g)"/>
  <g clip-path="url(#c)">
    <!-- peças brancas: roda grande, braço, roda pequena e haste -->
    <g fill="#fff">
      <circle cx="846" cy="482" r="240"/>
      <polygon points="606,486 453,709 620,880 840,721"/>
      <circle cx="445" cy="884" r="175"/>
      <polygon points="-20,586 349,737 274,922 -20,800"/>
    </g>
    <!-- vazado da roda pequena -->
    <circle cx="445" cy="884" r="135" fill="url(#g)"/>
    <g fill="#fff">
      <polygon points="250,694 478,791 404,975 200,891"/>
      <circle cx="441" cy="883" r="99"/>
    </g>
    <!-- anel da roda grande -->
    <circle cx="846" cy="482" r="160" fill="url(#g)"/>
    <circle cx="846" cy="482" r="120" fill="#fff"/>
  </g>
</svg>
